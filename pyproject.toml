[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "care-mm"
version = "1.0.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-learn==1.5.0",
  "torch==2.3.1",
  "PyYAML==6.0.1",
  "Pillow==10.3.0",
  "tifffile==2024.5.22",
  "h5py==3.11.0",
  "tqdm==4.66.4",
]

[project.scripts]
care-mm-train = "care_mm.commands.train:main"
care-mm-evaluate = "care_mm.commands.evaluate:main"
care-mm-prepare = "care_mm.commands.prepare:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["care_mm"]
mypy_path = "code"

